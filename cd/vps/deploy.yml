
name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de la imagen Docker que se desplegará"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en VPS mediante SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          port: 22
          envs: IMAGE_TAG
          script: |
            cd /opt/myapp
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
